server {
    listen 80;

    # serve the Angular static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # SPA routing — all paths fall back to index.html
    }

    # proxy API calls to the api container
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }
}
